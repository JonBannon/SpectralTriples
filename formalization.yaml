automation:
  ai_authorship: >
    Portions of the API, proofs, and project documentation were drafted with AI
    assistance under author review; all Lean results are kernel-checked.

fidelity:
  divergences:
    - "The bounded-commutator field writes the negative commutator [π(a),D] as an ℝ≥0∞ unit-ball supremum. Norm symmetry gives the conventional [D,π(a)]; IsOddSpectralTriple.exists_commutator_bound derives its homogeneous estimate, boundedCommutator packages its continuous extension on all of H, and boundedCommutator_unique proves uniqueness."
    - "Self-adjointness uses Mathlib's IsSelfAdjoint on LinearPMap (D† = D), which packages dense domain and closedness."
    - "LinearPMap.resolventSet uses bijectivity of z•1-D on D.domain; for a non-closed D this can differ from the conventional resolvent set. Spectral-triple D is closed."
    - "IsCompactResolventSpectralTriple records compact resolvent only. The former IsFinitelySummableSpectralTriple name is a deprecated compatibility alias; no Schatten or p-summability conclusion is claimed."
    - "gradedKernelIndex is presently a graded-kernel dimension difference. Equality with the Fredholm index of a chiral restriction has not been formalized."
    - "MagneticDirac.magneticPhase is a bounded Landau-level shift model, not the unbounded geometric twisted Dirac operator on T²."
    - "The normalized Hermite functions are proved orthonormal in L²(ℝ), but completeness and HilbertBasis packaging remain open."

review:
  status: "in progress; author and AI pre-review complete for tracked results, independent collaborator review pending"

