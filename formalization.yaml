status:
  scope: >
    A Lean 4 / Mathlib formalization of spectral triples with an unbounded
    LinearPMap Dirac operator as the spine. Formalized: odd and even
    spectral-triple cores, their grading/domain API, and the derived bounded
    commutator extension; LinearPMap resolvents;
    the complete self-adjoint off-real-axis resolvent criterion; a separate
    compact-resolvent predicate (not finite or p-summability); minimal Fredholm
    operator infrastructure, including Fredholmness of 1-K for compact K;
    finite-dimensionality of the Dirac kernel and the graded-kernel invariant;
    circle and flat-torus compact-resolvent examples; explicit Fredholm
    witnesses for the unilateral shift and the bounded flux-k magnetic phase;
    the exact function-theoretic count and an explicit basis of positive-degree
    theta sections, plus vanishing of the negative-degree holomorphic space;
    and a normalized orthonormal Hermite family in real or complex L²(ℝ). Not
    yet formalized:
    completeness of the Hermite family, the weighted geometric L² line-bundle
    operator, its equivalence with the magnetic phase, a chiral Dirac operator
    with a proved Fredholm-index comparison, or the general K₀ projection
    pairing.
  sorry_count: 0
  sorry_in_definitions: 0
